<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .titlebar { fill: #161b22; }
    .text { font-family: 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
    .prompt { fill: #58a6ff; }
    .output { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 13px; }
    .green { fill: #3fb950; font-family: 'Courier New', monospace; font-size: 13px; }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }
  </style>
  
  <!-- Window frame -->
  <rect class="bg" width="800" height="320" rx="6"/>
  
  <!-- Title bar -->
  <rect class="titlebar" width="800" height="32" rx="6"/>
  <rect class="bg" y="26" width="800" height="8"/>
  
  <!-- Window buttons -->
  <circle class="btn-red" cx="18" cy="16" r="6"/>
  <circle class="btn-yellow" cx="38" cy="16" r="6"/>
  <circle class="btn-green" cx="58" cy="16" r="6"/>
  
  <!-- Title -->
  <text x="400" y="20" text-anchor="middle" class="text" style="font-size: 11px; fill: #8b949e;">kuxala@github</text>
  
  <!-- Terminal content -->
  <text y="58" class="text">
    <tspan x="20" class="prompt">❯</tspan>
    <tspan> whoami</tspan>
  </text>
  <text x="20" y="78" class="output">Roma Kukhalashvili</text>
  
  <text y="106" class="text">
    <tspan x="20" class="prompt">❯</tspan>
    <tspan> echo $ROLE</tspan>
  </text>
  <text x="20" y="126" class="output">Full Stack Developer</text>
  
  <text y="154" class="text">
    <tspan x="20" class="prompt">❯</tspan>
    <tspan> ls skills/</tspan>
  </text>
  <text x="20" y="174" class="output">TypeScript  React  NestJS  Python  Postgres  MongoDB  Supabase  AI</text>
  
  <text y="202" class="text">
    <tspan x="20" class="prompt">❯</tspan>
    <tspan> pwd</tspan>
  </text>
  <text x="20" y="222" class="output">~/remote</text>
  
  <text y="250" class="text">
    <tspan x="20" class="prompt">❯</tspan>
    <tspan> echo $STATUS</tspan>
  </text>
  <text x="20" y="270" class="green">Working</text>
  
  <text y="298" class="text">
    <tspan x="20" class="prompt">❯</tspan>
    <tspan style="fill: #58a6ff;">_</tspan>
  </text>
</svg>