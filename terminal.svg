<svg width="850" height="380" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .titlebar { fill: #161b22; }
    .text { font-family: 'Courier New', monospace; font-size: 15px; fill: #c9d1d9; }
    .prompt { fill: #58a6ff; }
    .output { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 15px; }
    .green { fill: #3fb950; font-family: 'Courier New', monospace; font-size: 15px; }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }
  </style>
  
  <!-- Window frame -->
  <rect class="bg" width="850" height="380" rx="8"/>
  
  <!-- Title bar -->
  <rect class="titlebar" width="850" height="36" rx="8"/>
  <rect class="bg" y="28" width="850" height="10"/>
  
  <!-- Window buttons -->
  <circle class="btn-red" cx="20" cy="18" r="7"/>
  <circle class="btn-yellow" cx="42" cy="18" r="7"/>
  <circle class="btn-green" cx="64" cy="18" r="7"/>
  
  <!-- Title -->
  <text x="425" y="23" text-anchor="middle" class="text" style="font-size: 13px; fill: #8b949e;">kuxala@github</text>
  
  <!-- Terminal content -->
  <text y="70" class="text">
    <tspan x="24" class="prompt">❯</tspan>
    <tspan> whoami</tspan>
  </text>
  <text x="24" y="95" class="output">Roma Kukhalashvili</text>
  
  <text y="130" class="text">
    <tspan x="24" class="prompt">❯</tspan>
    <tspan> echo $ROLE</tspan>
  </text>
  <text x="24" y="155" class="output">Full Stack Developer</text>
  
  <text y="190" class="text">
    <tspan x="24" class="prompt">❯</tspan>
    <tspan> ls skills/</tspan>
  </text>
  <text x="24" y="215" class="output">TypeScript  React  NestJS  Python  Postgres  MongoDB  Supabase  AI</text>
  
  <text y="250" class="text">
    <tspan x="24" class="prompt">❯</tspan>
    <tspan> pwd</tspan>
  </text>
  <text x="24" y="275" class="output">~/remote</text>
  
  <text y="310" class="text">
    <tspan x="24" class="prompt">❯</tspan>
    <tspan> echo $STATUS</tspan>
  </text>
  <text x="24" y="335" class="green">Working</text>
  
  <text y="365" class="text">
    <tspan x="24" class="prompt">❯</tspan>
    <tspan style="fill: #58a6ff;">_</tspan>
  </text>
</svg>